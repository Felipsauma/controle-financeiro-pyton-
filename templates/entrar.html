{% extends "base.html" %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
  <div class="entrar">
    <div class="nota nota-entrar" aria-hidden="true">
      <img src="{{ url_for('icone') }}" alt="">
    </div>
    <h1>Controle de Gastos</h1>
    <p class="suave">Digite a senha que você criou ao abrir o programa no computador.</p>
    <form class="formulario" method="post">
      {% if erro %}<div class="aviso aviso-erro" role="alert">{{ erro }}</div>{% endif %}
      <label class="campo">Senha
        <input type="password" name="senha" autocomplete="current-password" required autofocus>
      </label>
      <button class="botao botao-largo" type="submit">Entrar</button>
    </form>
  </div>
{% endblock %}
