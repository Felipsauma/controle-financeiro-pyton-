<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Gastos">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1216" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="{{ url_for('icone') }}">
  <link rel="manifest" href="{{ url_for('manifesto') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
  <title>{% block titulo %}Controle de Gastos{% endblock %}</title>
</head>
<body>
  <header class="topo">{% block topo %}{% endblock %}</header>
  <main>
    {% for tipo, texto in get_flashed_messages(with_categories=true) %}
      <div class="aviso aviso-{{ tipo }}" role="status">{{ texto }}</div>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
  {% block rodape %}{% endblock %}
</body>
</html>
